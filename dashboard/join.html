<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AutoLab-এ যোগ দিন</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* This page is open without a login, so its styles are inline (pages.css needs a login). */
    :root {
      --bg: #0d0c12; --surface: #17151f; --surface-2: #211e2c; --line: #2e2a3d;
      --text: #f3f1fa; --muted: #9a95ad; --accent: #ff3d5a; --err: #ff5c5c;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Hind Siliguri", system-ui, sans-serif; font-size: 15px;
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px;
      display: grid; place-items: center; padding: 24px 16px;
    }
    .card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
    .mono { font-family: "JetBrains Mono", monospace; letter-spacing: .08em; font-size: 12px; color: var(--muted); }
    form, .state { padding: 26px 24px 24px; display: grid; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: "JetBrains Mono", monospace; letter-spacing: .12em; font-weight: 700; }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 4px 0 0; font-size: 24px; line-height: 1.3; }
    p { margin: 0; }
    .sub { color: var(--muted); margin-top: -6px; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
    input { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button { font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 12px; cursor: pointer; margin-top: 4px; }
    button:disabled { opacity: .6; cursor: wait; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .error { background: #ff5c5c1f; color: var(--err); border: 1px solid #ff5c5c55; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .error:empty { display: none; }
    .note { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    a { color: #8fb4ff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="mono">INVITATION</span></div>

    <div class="state" id="checking"><p class="sub">ইনভাইট লিংক যাচাই হচ্ছে…</p></div>

    <div class="state" id="invalid" hidden>
      <div class="brand"><span class="dot"></span>AUTOLAB</div>
      <h1>লিংকটা কাজ করছে না</h1>
      <p class="sub" id="invalidText"></p>
      <p>অ্যাকাউন্ট আগে থেকে থাকলে <a href="/login">লগইন করুন</a>।</p>
    </div>

    <form id="form" hidden>
      <div class="brand"><span class="dot"></span>AUTOLAB</div>
      <h1>আপনার AI কনটেন্ট টিম</h1>
      <p class="sub">কয়েকটা তথ্য দিন। এরপর সেটআপ পেজে আপনার Instagram আর Telegram যুক্ত করবেন।</p>
      <p class="note" id="note" hidden></p>
      <div class="error" id="error" role="alert"></div>
      <label>আপনার নাম <input name="name" autocomplete="name" maxlength="80" required></label>
      <label>কোম্পানি / পেজের নাম <input name="company" autocomplete="organization" maxlength="80" required></label>
      <label>Instagram হ্যান্ডেল <input name="handle" placeholder="@yourpage" maxlength="40" required></label>
      <label>ইমেইল <span class="hint">এটা দিয়েই লগইন করবেন</span><input name="email" type="email" autocomplete="username" required></label>
      <label>পাসওয়ার্ড <span class="hint">অন্তত ৮ অক্ষর</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <button type="submit" id="submit">যোগ দিন</button>
    </form>
  </main>
  <script>
    const code = new URLSearchParams(location.search).get("code") || "";
    const $ = (s) => document.querySelector(s);
    const showInvalid = (text) => { $("#checking").hidden = true; $("#invalid").hidden = false; $("#invalidText").textContent = text; };

    fetch(`/api/join?code=${encodeURIComponent(code)}`)
      .then((r) => r.json())
      .then((j) => {
        if (!j.ok) return showInvalid(j.error || "ইনভাইট লিংকটা ঠিক নেই।");
        $("#checking").hidden = true;
        $("#form").hidden = false;
        if (j.note) { $("#note").hidden = false; $("#note").textContent = `আমন্ত্রণ: ${j.note}`; }
      })
      .catch(() => showInvalid("এই মুহূর্তে যাচাই করা যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।"));

    $("#form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = $("#submit");
      btn.disabled = true;
      $("#error").textContent = "";
      try {
        const body = { code, ...Object.fromEntries(new FormData(e.target)) };
        const r = await fetch("/api/join", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j.error || "কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।");
        location.replace(j.redirect || "/setup");
      } catch (err) {
        $("#error").textContent = err.message;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
