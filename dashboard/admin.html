<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AutoLab Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main class="wrap">
    <div class="head">
      <div class="brand"><span class="dot"></span>AUTOLAB · ADMIN</div>
      <div><a href="/">ড্যাশবোর্ডে যান →</a> · <a href="/api/logout">লগআউট</a></div>
    </div>
    <h1>কাস্টমার আর ইনভাইট</h1>

    <section class="card">
      <h2>নতুন ইনভাইট লিংক</h2>
      <p class="hint">প্রতিটা লিংক দিয়ে একজনই যোগ দিতে পারবে। লিংকটা কাস্টমারকে পাঠিয়ে দিন।</p>
      <div class="grid2">
        <label>কার জন্য <span class="hint">শুধু আপনার মনে রাখার জন্য, কাস্টমারও দেখবে</span><input id="note" maxlength="100" placeholder="যেমন: Dhaka Food Club"></label>
        <label>কত দিন চলবে
          <select id="days"><option value="3">৩ দিন</option><option value="7" selected>৭ দিন</option><option value="14">১৪ দিন</option><option value="30">৩০ দিন</option></select>
        </label>
      </div>
      <div class="actions"><button id="create">লিংক বানাও</button></div>
      <div class="msg" id="createMsg"></div>
    </section>

    <section class="card">
      <h2>কাস্টমার</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>নাম</th><th>অবস্থা</th><th>অ্যাকাউন্ট</th><th>যোগ দিয়েছে</th><th></th></tr></thead>
        <tbody id="tenants"></tbody>
      </table></div>
      <div class="msg" id="tenantMsg"></div>
    </section>

    <section class="card">
      <h2>ইনভাইট</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>কার জন্য</th><th>অবস্থা</th><th>লিংক</th><th></th></tr></thead>
        <tbody id="invites"></tbody>
      </table></div>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
