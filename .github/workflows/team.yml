name: AutoLab team

# The code lives in this (public) repository. The team's memory (drafts, logs, post images)
# and the dashboard site live in a separate private repository, set in the DATA_REPO variable
# (for example "your-name/autolab-data"). Vercel deploys the dashboard from that private repo.

# Runs are started by an external scheduler (cron-job.org) through the GitHub API,
# because GitHub's own schedule did not fire for this account. See README.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "shift = run the whole team, telegram = sync approvals + publish to Instagram, inbox = turn Pakhi's requests into drafts, bot = run one Specialised Team bot, check-feeds = test sources, test-telegram = send a Telegram test message"
        default: shift
        type: choice
        options: [shift, telegram, inbox, bot, check-feeds, test-telegram]
      niche:
        description: "Which niche to run (auto = next in rotation)"
        default: auto
        type: choice
        options: [auto, events, food, gta6, cinema, history, news]
      bot:
        description: "Bot id (only for mode = bot)"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: autolab-team
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
      NICHE: ${{ github.event.inputs.niche != 'auto' && github.event.inputs.niche || '' }}
      MODE: ${{ github.event.inputs.mode || 'shift' }}
      BOT_ID: ${{ github.event.inputs.bot }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the private team memory
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: site

      - name: Link team memory into the workspace
        run: |
          mkdir -p site/data site/output
          rm -rf data output
          ln -s site/data data
          ln -s site/output output

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium (for post images)
        if: contains(fromJSON('["shift","telegram","inbox","bot"]'), env.MODE)
        run: npx playwright install --with-deps chromium

      - name: Run team shift
        if: env.MODE == 'shift'
        run: npm run run

      - name: Sync Telegram approvals and publish to Instagram
        if: env.MODE == 'telegram'
        run: npm run sync

      - name: Turn Pakhi's requests into drafts
        if: env.MODE == 'inbox'
        run: npm run inbox

      - name: Run a Specialised Team bot
        if: env.MODE == 'bot'
        run: npm run bot

      - name: Test news sources
        if: env.MODE == 'check-feeds'
        run: npm run check-feeds

      - name: Test Telegram setup
        if: env.MODE == 'test-telegram'
        run: npm run test-telegram

      - name: Save team memory and dashboard to the private repo
        if: always()
        run: |
          # Keep the dashboard site in the private repo up to date with this code.
          rm -rf site/dashboard site/scripts site/api
          cp -r dashboard site/dashboard
          cp -r api site/api
          mkdir -p site/scripts
          cp scripts/build-dashboard.mjs site/scripts/
          cp middleware.js vercel.json team.json site/
          echo '{ "private": true, "type": "module" }' > site/package.json
          printf 'public/\nnode_modules/\n' > site/.gitignore

          cd site
          git config user.name "autolab-bot"
          git config user.email "autolab-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Team ${MODE}: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
